{% extends "base.html" %}
{% block title %}Sign in - specflo{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if no_users %}
<p class="notice">{{ no_users }}</p>
{% endif %}
{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="{{ signin_path }}">
  <label>
    User name
    <input type="text" name="name" value="{{ name or '' }}" autocomplete="username" autocapitalize="none" required>
  </label>
  <label>
    Password
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
