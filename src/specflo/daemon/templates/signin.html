{% extends "base.html" %}
{% block title %}Sign in - specflo{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="{{ signin_path }}">
  <fieldset>
    <legend>Identity</legend>
    {% for name in identities %}
    <label>
      <input type="radio" name="identity" value="{{ name }}" required{% if name == chosen %} checked{% endif %}>
      {{ name }}
    </label>
    {% endfor %}
  </fieldset>
  <label>
    Token
    <input type="password" name="token" autocomplete="off" required>
  </label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
