<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}specflo{% endblock %}</title>
  <style>
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1f2328; background: #fafafa; }
    header { display: flex; align-items: baseline; gap: 1rem; padding: 0.75rem 1.25rem; background: #fff; border-bottom: 1px solid #d0d7de; }
    header .brand { font-weight: 600; color: inherit; text-decoration: none; }
    header .identity { margin-left: auto; color: #57606a; }
    main { max-width: 60rem; margin: 0 auto; padding: 1.25rem; }
    .error { color: #a40e26; }
    fieldset { border: 1px solid #d0d7de; border-radius: 4px; }
    label { display: block; margin: 0.5rem 0; }
    button { padding: 0.4rem 0.9rem; }
  </style>
  <script src="{{ assets_path }}/htmx.min.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="{{ home_path }}">specflo</a>
    {% if identity %}
    <span class="identity">signed in as <strong>{{ identity }}</strong></span>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
