<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}specflo{% endblock %}</title>
  <link rel="stylesheet" href="{{ assets_path }}/github-markdown.css">
  <link rel="stylesheet" href="{{ assets_path }}/specflo.css">
  <link rel="stylesheet" href="{{ assets_path }}/daemon.css">
  <script src="{{ assets_path }}/htmx.min.js"></script>
  <script src="{{ assets_path }}/hx-sse.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ home_path }}">
        <svg viewBox="0 0 30 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square">
          <path d="M3 4l7 7-7 7M12 4l7 7-7 7M24 3v16"/>
        </svg>
        specflo
      </a>
      {% if identity %}
      <nav class="site-nav" aria-label="Site">
        <a href="{{ home_path }}">Products</a>
        <a href="{{ pool_path }}">Pool</a>
        <a href="{{ bench_path }}">Bench</a>
      </nav>
      {% if viewer %}
      <span class="identity">Signed in as <strong>{{ viewer }}</strong></span>
      {% endif %}
      <a class="settings" href="{{ user_path }}">Settings</a>
      <form class="signout" method="post" action="{{ signout_path }}">
        <input type="hidden" name="session" value="{{ session }}">
        <button type="submit">Sign out</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
