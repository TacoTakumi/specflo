# Arm config for the model bench. An arm is one llama-swap entry and one
# harness; a run adds a level and a run index. Runs naming anything not listed
# here are refused before any request reaches llama-swap.
#
# entries: llama-swap entry ids (keys of ~/AI/Engines/models-llamacpp-swap.yaml).
entries:
  swift15-flash-next-iq4xs-mtp-vision:
    engine: llama.cpp
  swift15-flash-next-iq4xs-strata-2x3090:
    engine: strata

harnesses:
  - pi
  - claude-code

# Per-level limits in seconds, set from the Strata pilot (2026-10-08): about 3x
# the longest run at the level (quick 83 s, fast 962 s, full 1886 s), and a
# stall limit about 15x the longest quiet gap seen (40 s between requests).
levels:
  quick: {wall_clock: 600, stall_limit: 600}
  fast: {wall_clock: 3000, stall_limit: 600}
  full: {wall_clock: 6000, stall_limit: 600}

# Per-engine settings. limit_factor scales the level limits for runs on that
# engine's entries: llama.cpp quick runs took 2.0-2.5x the Strata ones.
engines:
  llama.cpp: {limit_factor: 2.5}
